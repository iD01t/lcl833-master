[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lcl833-master"
version = "0.3.0"
description = "Exact Jones polynomial calculator, LaTeX exporter, and calibrated LCL-833 metrics (PRO)"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Guillaume Lessard"}
]
keywords = ["knot-theory", "jones-polynomial", "braid-group", "topological-quantum-computing", "lcl833", "sati-codex", "latex-export", "multiprocessing"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

[project.urls]
Homepage = "https://github.com/example/lcl833-master"
Source = "https://github.com/example/lcl833-master"
Bug-Tracker = "https://github.com/example/lcl833-master/issues"

[project.scripts]
lcl833 = "lcl833_master.core:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lcl833_master = ["py.typed"]
